<div id="main-menu-mobile" class="mobile-menu-overlay" role="dialog" aria-modal="true" aria-label="Mobile navigation">
  <!-- Close button -->
  <button id="close-mobile-menu" type="button" aria-label="Close mobile menu"
          class="absolute top-5 right-5 text-white w-10 h-10 flex items-center justify-center rounded focus:outline-none focus:ring-2 focus:ring-white">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <nav>
    <ul class="flex flex-col items-center gap-8">
      {% for item in site.data.nav %}
        <li>
          {% if item.external %}
            <a href="{{ item.url }}" target="_blank" rel="noopener"
               class="text-white text-2xl font-heading hover:text-brand-taupe transition-colors duration-200">
              {{ item.title }}
            </a>
          {% else %}
            <a href="{{ item.url }}"
               class="text-white text-2xl font-heading hover:text-brand-taupe transition-colors duration-200 {% if page.url == item.url %}underline underline-offset-4{% endif %}">
              {{ item.title }}
            </a>
          {% endif %}
        </li>
      {% endfor %}
    </ul>
  </nav>
</div>
